<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="sans-serif" role="img" aria-label="AgentArsenal banner: an armored guardian keeping the skill arsenal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a11"/>
      <stop offset="0.5" stop-color="#0b101a"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3549"/>
      <stop offset="0.55" stop-color="#161d2b"/>
      <stop offset="1" stop-color="#0c111a"/>
    </linearGradient>
    <linearGradient id="steelR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="0.35" stop-color="#243046"/>
      <stop offset="0.65" stop-color="#141b28"/>
      <stop offset="1" stop-color="#0a0e15"/>
    </linearGradient>
    <linearGradient id="bladeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.25" stop-color="#9fb4cc"/>
      <stop offset="0.5" stop-color="#d7e6f5"/>
      <stop offset="0.75" stop-color="#8ea3bd"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#1b2433" stroke-width="1" opacity="0.6"/>
    </pattern>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <g id="em">
      <path d="M0 -10 L9 -4.5 V3.5 C9 9 4.5 12.5 0 14.5 C-4.5 12.5 -9 9 -9 3.5 V-4.5 Z"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#vign)"/>

  <!-- top / bottom accent bars -->
  <rect width="1200" height="3" fill="url(#accent)"/>
  <rect y="397" width="1200" height="3" fill="url(#accent)" opacity="0.55"/>

  <!-- ================= left content ================= -->
  <text x="80" y="104" fill="#22d3ee" font-size="17" font-weight="600" letter-spacing="6">THE ARSENAL KEEPER</text>
  <text x="78" y="178" font-size="80" font-weight="800" letter-spacing="-2"><tspan fill="#f3f4f6">Agent</tspan><tspan fill="url(#accent)">Arsenal</tspan></text>
  <text x="82" y="222" fill="#9aa7bd" font-size="17" font-weight="400" letter-spacing="1.5">ONE ARSENAL. EVERY SKILL. QUALITY ENFORCED BY MACHINES.</text>
  <rect x="82" y="242" width="220" height="4" rx="2" fill="url(#accent)"/>

  <!-- stat pills -->
  <g>
    <rect x="80" y="268" width="196" height="48" rx="24" fill="#0d1420" stroke="#22d3ee" stroke-width="1.5"/>
    <text id="stat-skills" x="178" y="293" fill="#e8fbff" font-size="26" font-weight="800" text-anchor="middle">246</text>
    <text x="178" y="311" fill="#7d8ea8" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle">SKILLS</text>
    <rect x="288" y="268" width="196" height="48" rx="24" fill="#0d1420" stroke="#34d399" stroke-width="1.5"/>
    <text id="stat-domains" x="386" y="293" fill="#e8fbff" font-size="26" font-weight="800" text-anchor="middle">28</text>
    <text x="386" y="311" fill="#7d8ea8" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle">DOMAINS</text>
    <rect x="496" y="268" width="196" height="48" rx="24" fill="#0d1420" stroke="#3b4a63" stroke-width="1.5"/>
    <text x="594" y="298" fill="#aeb9cc" font-size="17" font-weight="700" letter-spacing="1" text-anchor="middle">CI VALIDATED</text>
  </g>

  <!-- ================= right side: arsenal wall ================= -->
  <rect x="840" y="70" width="292" height="306" rx="10" fill="#080b12" opacity="0.88" stroke="#1c2839" stroke-width="1.5"/>
  <rect x="840" y="70" width="6" height="306" fill="#101724"/>
  <rect x="1126" y="70" width="6" height="306" fill="#101724"/>
  <text x="846" y="93" fill="#3b4a63" font-size="9" font-weight="600" letter-spacing="0.5">SKILL VAULT</text>
  <g>
    <use href="#em" transform="translate(872 116)" fill="none" stroke="#2c3c55" stroke-width="1.6" opacity="0.55"/>
    <use href="#em" transform="translate(924 116)" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.7"/>
    <use href="#em" transform="translate(976 116)" fill="#22d3ee" fill-opacity="0.22" stroke="#67e8f9" stroke-width="1.6" opacity="0.9"/>
    <use href="#em" transform="translate(1028 116)" fill="none" stroke="#2c3c55" stroke-width="1.6" opacity="0.55"/>
    <use href="#em" transform="translate(1080 116)" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.7"/>
    <use href="#em" transform="translate(872 158)" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.7"/>
    <use href="#em" transform="translate(924 158)" fill="none" stroke="#2c3c55" stroke-width="1.6" opacity="0.55"/>
    <use href="#em" transform="translate(976 158)" fill="none" stroke="#2c3c55" stroke-width="1.6" opacity="0.55"/>
    <use href="#em" transform="translate(1028 158)" fill="#22d3ee" fill-opacity="0.22" stroke="#67e8f9" stroke-width="1.6" opacity="0.9"/>
    <use href="#em" transform="translate(1080 158)" fill="none" stroke="#2c3c55" stroke-width="1.6" opacity="0.55"/>
    <use href="#em" transform="translate(872 200)" fill="none" stroke="#2c3c55" stroke-width="1.6" opacity="0.55"/>
    <use href="#em" transform="translate(924 200)" fill="#22d3ee" fill-opacity="0.22" stroke="#67e8f9" stroke-width="1.6" opacity="0.9"/>
    <use href="#em" transform="translate(976 200)" fill="none" stroke="#2c3c55" stroke-width="1.6" opacity="0.55"/>
    <use href="#em" transform="translate(1028 200)" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.7"/>
    <use href="#em" transform="translate(1080 200)" fill="none" stroke="#2c3c55" stroke-width="1.6" opacity="0.55"/>
    <use href="#em" transform="translate(872 242)" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.7"/>
    <use href="#em" transform="translate(924 242)" fill="none" stroke="#2c3c55" stroke-width="1.6" opacity="0.55"/>
    <use href="#em" transform="translate(976 242)" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.7"/>
    <use href="#em" transform="translate(1028 242)" fill="none" stroke="#2c3c55" stroke-width="1.6" opacity="0.55"/>
    <use href="#em" transform="translate(1080 242)" fill="#22d3ee" fill-opacity="0.22" stroke="#67e8f9" stroke-width="1.6" opacity="0.9"/>
    <use href="#em" transform="translate(872 284)" fill="none" stroke="#2c3c55" stroke-width="1.6" opacity="0.55"/>
    <use href="#em" transform="translate(924 284)" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.7"/>
    <use href="#em" transform="translate(976 284)" fill="none" stroke="#2c3c55" stroke-width="1.6" opacity="0.55"/>
    <use href="#em" transform="translate(1028 284)" fill="none" stroke="#2c3c55" stroke-width="1.6" opacity="0.55"/>
    <use href="#em" transform="translate(1080 284)" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.7"/>
  </g>

  <!-- aura behind the guardian -->
  <ellipse cx="986" cy="220" rx="170" ry="185" fill="url(#halo)"/>
  <g fill="none" stroke="#22d3ee">
    <circle cx="986" cy="170" r="120" stroke-width="2" opacity="0.3" stroke-dasharray="3 9"/>
    <circle cx="986" cy="170" r="150" stroke-width="1.5" opacity="0.18" stroke-dasharray="2 12"/>
  </g>
  <polygon points="700,0 860,0 1050,400 890,400" fill="#22d3ee" opacity="0.045"/>


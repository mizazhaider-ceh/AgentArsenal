    <path d="M 977 252 L 995 252 L 993 356 L 986 390 L 979 356 Z" fill="url(#bladeG)" stroke="#0b0e14" stroke-width="1"/>
    <path d="M 986 262 L 986 352" stroke="#0e7490" stroke-width="3" opacity="0.55"/>
    <path d="M 977 252 L 979 356" stroke="#e0faff" stroke-width="2"/>

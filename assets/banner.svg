<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="sans-serif" role="img" aria-label="AgentArsenal banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="0.55" stop-color="#10141f"/>
      <stop offset="1" stop-color="#0a0c12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="1" stop-color="#0c2433"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1f2937" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#glow)" opacity="0.7"/>

  <!-- decorative orbit rings, right side -->
  <g fill="none" stroke="#22d3ee" opacity="0.16">
    <circle cx="1020" cy="200" r="70" stroke-width="2"/>
    <circle cx="1020" cy="200" r="105" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle cx="1020" cy="200" r="140" stroke-width="1"/>
  </g>
  <g fill="none" stroke="#34d399" opacity="0.14">
    <circle cx="150" cy="330" r="55" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="1085" cy="80" r="30" stroke-width="1.5"/>
  </g>
  <!-- small floating nodes -->
  <g fill="#22d3ee" opacity="0.5">
    <circle cx="300" cy="90" r="4"/>
    <circle cx="700" cy="320" r="4"/>
    <circle cx="950" cy="300" r="4"/>
  </g>
  <g fill="#34d399" opacity="0.5">
    <circle cx="420" cy="330" r="3.5"/>
    <circle cx="850" cy="100" r="3.5"/>
  </g>

  <!-- geometric shield emblem -->
  <g transform="translate(96,118)">
    <path d="M60 8 L104 28 V70 C104 98 84 116 60 128 C36 116 16 98 16 70 V28 Z"
          fill="url(#shield)" stroke="url(#accent)" stroke-width="4"/>
    <path d="M60 30 L86 42 V66 C86 84 74 96 60 104 C46 96 34 84 34 66 V42 Z"
          fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.7"/>
    <path d="M48 66 L57 75 L74 54" fill="none" stroke="#34d399" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="250" y="196" fill="#f3f4f6" font-size="84" font-weight="800" letter-spacing="-2">Agent</text><text x="498" y="196" fill="url(#accent)" font-size="84" font-weight="800" letter-spacing="-2">Arsenal</text>
  <text x="252" y="244" fill="#9ca3af" font-size="24" font-weight="400" letter-spacing="1.5">ONE ARSENAL. EVERY SKILL. QUALITY ENFORCED BY MACHINES.</text>

  <!-- accent divider -->
  <rect x="252" y="266" width="240" height="4" rx="2" fill="url(#accent)"/>

  <!-- stat chips -->
  <g font-size="18" font-weight="600">
    <rect x="252" y="292" width="150" height="38" rx="19" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="327" y="317" fill="#d1d5db" text-anchor="middle">127 skills</text>
    <rect x="414" y="292" width="150" height="38" rx="19" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="489" y="317" fill="#d1d5db" text-anchor="middle">21 domains</text>
    <rect x="576" y="292" width="170" height="38" rx="19" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="661" y="317" fill="#d1d5db" text-anchor="middle">CI validated</text>
  </g>

  <!-- thin top border accent -->
  <rect width="1200" height="3" fill="url(#accent)"/>
</svg>

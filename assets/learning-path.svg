<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="sans-serif" role="img" aria-label="Learning path: foundations, practitioner, specialist, operator with real skill and agent names">
<defs>
<linearGradient id="flameg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#A3FF12"/>
</linearGradient>
<g id="flame">
<path d="M0,-22 C7,-13 15,-8 15,5 C15,14 8,20 0,20 C-8,20 -15,14 -15,5 C-15,-3 -10,-8 -6,-13 C-4,-9 -2,-8 -2,-12 C-2,-16 -1,-19 0,-22 Z" fill="url(#flameg)"/>
<path d="M0,-9 C4,-4 8,-1 8,6 C8,11 4,14 0,14 C-4,14 -8,11 -8,6 C-8,1 -4,-2 -2,-6 C-1,-3 0,-3 0,-9 Z" fill="#FFFFFF" opacity="0.9"/>
</g>
</defs>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F6F2FF"/>
      <stop offset="1" stop-color="#ECE4FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#A3FF12"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#F5F2FF" stroke-width="1" opacity="0.6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <rect width="1200" height="3" fill="url(#accent)"/>

  <text x="600" y="52" fill="#171923" font-size="34" font-weight="800" text-anchor="middle">Learning path</text>
<use href="#flame" transform="translate(400,48) scale(0.85)"/><use href="#flame" transform="translate(800,48) scale(0.85)"/>
  <text x="600" y="82" fill="#5B6076" font-size="16" text-anchor="middle">From first scan to running operations: one stage at a time, with the real artifact names</text>

  <!-- stage 1 -->
  <g>
    <rect x="40" y="110" width="250" height="510" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
    <text x="165" y="148" fill="#6D28D9" font-size="17" font-weight="800" letter-spacing="2" text-anchor="middle">FOUNDATIONS</text>
    <text x="165" y="172" fill="#5B6076" font-size="14" text-anchor="middle">beginner</text>
    <text x="165" y="208" fill="#171923" font-size="15" text-anchor="middle">recon-passive</text>
    <text x="165" y="236" fill="#171923" font-size="15" text-anchor="middle">recon-active</text>
    <text x="165" y="264" fill="#171923" font-size="15" text-anchor="middle">nmap-methodology</text>
    <text x="165" y="292" fill="#171923" font-size="15" text-anchor="middle">linux-hardening</text>
    <text x="165" y="320" fill="#171923" font-size="15" text-anchor="middle">git-workflows</text>
    <rect x="40" y="540" width="250" height="80" rx="0" fill="#FFFFFF"/>
    <text x="165" y="568" fill="#4D7C0F" font-size="14" font-weight="700" text-anchor="middle">OUTCOME</text>
    <text x="165" y="592" fill="#5B6076" font-size="13" text-anchor="middle">Run tools safely, read output</text>
  </g>

  <!-- stage 2 -->
  <g>
    <rect x="325" y="110" width="250" height="510" rx="12" fill="#FFFFFF" stroke="#DCD7F0" stroke-width="1.5"/>
    <text x="450" y="148" fill="#6D28D9" font-size="17" font-weight="800" letter-spacing="2" text-anchor="middle">PRACTITIONER</text>
    <text x="450" y="172" fill="#5B6076" font-size="14" text-anchor="middle">intermediate</text>
    <text x="450" y="208" fill="#171923" font-size="15" text-anchor="middle">webapp-pentest-methodology</text>
    <text x="450" y="236" fill="#171923" font-size="15" text-anchor="middle">web-sqli</text>
    <text x="450" y="264" fill="#171923" font-size="15" text-anchor="middle">incident-response</text>
    <text x="450" y="292" fill="#171923" font-size="15" text-anchor="middle">siem-detections</text>
    <text x="450" y="320" fill="#171923" font-size="15" text-anchor="middle">bug-bounty-workflow</text>
    <text x="450" y="360" fill="#6D28D9" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">AGENT</text>
    <text x="450" y="384" fill="#171923" font-size="15" text-anchor="middle">recon-agent</text>
    <rect x="325" y="540" width="250" height="80" rx="0" fill="#FFFFFF"/>
    <text x="450" y="568" fill="#4D7C0F" font-size="14" font-weight="700" text-anchor="middle">OUTCOME</text>
    <text x="450" y="592" fill="#5B6076" font-size="13" text-anchor="middle">Follow full procedures end to end</text>
  </g>

  <!-- stage 3 -->
  <g>
    <rect x="610" y="110" width="250" height="510" rx="12" fill="#FFFFFF" stroke="#DCD7F0" stroke-width="1.5"/>
    <text x="735" y="148" fill="#6D28D9" font-size="17" font-weight="800" letter-spacing="2" text-anchor="middle">SPECIALIST</text>
    <text x="735" y="172" fill="#5B6076" font-size="14" text-anchor="middle">advanced</text>
    <text x="735" y="208" fill="#171923" font-size="15" text-anchor="middle">ad-enumeration</text>
    <text x="735" y="236" fill="#171923" font-size="15" text-anchor="middle">privesc-linux</text>
    <text x="735" y="264" fill="#171923" font-size="15" text-anchor="middle">api-security-testing</text>
    <text x="735" y="292" fill="#171923" font-size="15" text-anchor="middle">llm-red-teaming</text>
    <text x="735" y="330" fill="#6D28D9" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">AGENTS</text>
    <text x="735" y="354" fill="#171923" font-size="15" text-anchor="middle">web-exploitation-agent</text>
    <text x="735" y="378" fill="#171923" font-size="15" text-anchor="middle">soc-analyst-agent</text>
    <text x="735" y="416" fill="#6D28D9" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">BRAINS</text>
    <text x="735" y="440" fill="#171923" font-size="15" text-anchor="middle">attacker-mindset</text>
    <text x="735" y="464" fill="#171923" font-size="15" text-anchor="middle">threat-modeling</text>
    <rect x="610" y="540" width="250" height="80" rx="0" fill="#FFFFFF"/>
    <text x="735" y="568" fill="#4D7C0F" font-size="14" font-weight="700" text-anchor="middle">OUTCOME</text>
    <text x="735" y="592" fill="#5B6076" font-size="13" text-anchor="middle">Own one domain completely</text>
  </g>

  <!-- stage 4 -->
  <g>
    <rect x="895" y="110" width="250" height="510" rx="12" fill="#FFFFFF" stroke="#4D7C0F" stroke-width="2"/>
    <text x="1020" y="148" fill="#4D7C0F" font-size="17" font-weight="800" letter-spacing="2" text-anchor="middle">OPERATOR</text>
    <text x="1020" y="172" fill="#5B6076" font-size="14" text-anchor="middle">expert</text>
    <text x="1020" y="208" fill="#4D7C0F" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">AGENTS</text>
    <text x="1020" y="232" fill="#171923" font-size="15" text-anchor="middle">incident-commander-agent</text>
    <text x="1020" y="256" fill="#171923" font-size="15" text-anchor="middle">bug-bounty-hunter-agent</text>
    <text x="1020" y="280" fill="#171923" font-size="15" text-anchor="middle">secure-architect-agent</text>
    <text x="1020" y="304" fill="#171923" font-size="15" text-anchor="middle">pentest-reporter-agent</text>
    <text x="1020" y="342" fill="#4D7C0F" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">PLAYBOOKS</text>
    <text x="1020" y="366" fill="#171923" font-size="15" text-anchor="middle">external-pentest</text>
    <text x="1020" y="390" fill="#171923" font-size="15" text-anchor="middle">soc-triage-day</text>
    <text x="1020" y="428" fill="#4D7C0F" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">BRAIN</text>
    <text x="1020" y="452" fill="#171923" font-size="15" text-anchor="middle">incident-command-mindset</text>
    <rect x="895" y="540" width="250" height="80" rx="0" fill="#FFFFFF"/>
    <text x="1020" y="568" fill="#4D7C0F" font-size="14" font-weight="700" text-anchor="middle">OUTCOME</text>
    <text x="1020" y="592" fill="#5B6076" font-size="13" text-anchor="middle">Run operations, lead response</text>
  </g>

  <!-- arrows -->
  <line x1="290" y1="365" x2="320" y2="365" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="575" y1="365" x2="605" y2="365" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="860" y1="365" x2="890" y2="365" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="600" y="676" fill="#5B6076" font-size="14" text-anchor="middle">Each stage's skills install with their dependencies: ./install.sh --platform &lt;name&gt; --version &lt;skill&gt;@&lt;version&gt;</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="sans-serif" role="img" aria-label="AgentArsenal ecosystem map: manifest hub with skills, sub-skills, agents, brains, memory, decisions, playbooks, tools, platforms">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a11"/>
      <stop offset="0.5" stop-color="#0b101a"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#A3FF12"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#222431" stroke-width="1" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="3" fill="url(#accent)"/>

  <text x="600" y="52" fill="#f3f4f6" font-size="34" font-weight="800" text-anchor="middle">Ecosystem map</text>
  <text x="600" y="82" fill="#9aa7bd" font-size="16" text-anchor="middle">One manifest drives the installer, the docs site, and the marketplace. Counts as of 2026-10-23.</text>

  <!-- spokes (behind nodes) -->
  <g stroke="#2E3247" stroke-width="1.5">
    <line x1="600" y1="410" x2="600" y2="140"/>
    <line x1="600" y1="410" x2="880" y2="203"/>
    <line x1="600" y1="410" x2="1030" y2="360"/>
    <line x1="600" y1="410" x2="978" y2="538"/>
    <line x1="600" y1="410" x2="748" y2="654"/>
    <line x1="600" y1="410" x2="452" y2="654"/>
    <line x1="600" y1="410" x2="222" y2="538"/>
    <line x1="600" y1="410" x2="170" y2="360"/>
    <line x1="600" y1="410" x2="320" y2="203"/>
  </g>

  <!-- hub -->
  <circle cx="600" cy="410" r="112" fill="#171923" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="600" y="392" fill="#f3f4f6" font-size="26" font-weight="800" text-anchor="middle">manifest</text>
  <text x="600" y="420" fill="#9aa7bd" font-size="15" text-anchor="middle">arsenal-manifest.json</text>
  <text x="600" y="442" fill="#7d8ea8" font-size="13" text-anchor="middle">single source of truth</text>

  <!-- skills -->
  <g>
    <rect x="500" y="88" width="200" height="104" rx="10" fill="#171923" stroke="#A78BFA" stroke-width="2"/>
    <text x="600" y="116" fill="#A78BFA" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">SKILLS</text>
    <text x="600" y="142" fill="#f3f4f6" font-size="24" font-weight="800" text-anchor="middle">285</text>
    <text x="600" y="166" fill="#9aa7bd" font-size="13" text-anchor="middle">procedures in 29 domains</text>
  </g>
  <!-- sub-skills -->
  <g>
    <rect x="780" y="151" width="200" height="104" rx="10" fill="#171923" stroke="#2E3247" stroke-width="1.5"/>
    <text x="880" y="179" fill="#A78BFA" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">SUB-SKILLS</text>
    <text x="880" y="205" fill="#f3f4f6" font-size="24" font-weight="800" text-anchor="middle">227</text>
    <text x="880" y="229" fill="#9aa7bd" font-size="13" text-anchor="middle">drill-downs with a parent</text>
  </g>
  <!-- agents -->
  <g>
    <rect x="930" y="308" width="200" height="104" rx="10" fill="#171923" stroke="#2E3247" stroke-width="1.5"/>
    <text x="1030" y="336" fill="#A78BFA" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">AGENTS</text>
    <text x="1030" y="362" fill="#f3f4f6" font-size="24" font-weight="800" text-anchor="middle">25</text>
    <text x="1030" y="386" fill="#9aa7bd" font-size="13" text-anchor="middle">bind skills + brains</text>
  </g>
  <!-- brains -->
  <g>
    <rect x="878" y="486" width="200" height="104" rx="10" fill="#171923" stroke="#2E3247" stroke-width="1.5"/>
    <text x="978" y="514" fill="#A78BFA" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">BRAINS</text>
    <text x="978" y="540" fill="#f3f4f6" font-size="24" font-weight="800" text-anchor="middle">16</text>
    <text x="978" y="564" fill="#9aa7bd" font-size="13" text-anchor="middle">mental models, heuristics</text>
  </g>
  <!-- memory -->
  <g>
    <rect x="648" y="602" width="200" height="104" rx="10" fill="#171923" stroke="#2E3247" stroke-width="1.5"/>
    <text x="748" y="630" fill="#A78BFA" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">MEMORY</text>
    <text x="748" y="656" fill="#f3f4f6" font-size="24" font-weight="800" text-anchor="middle">3</text>
    <text x="748" y="680" fill="#9aa7bd" font-size="13" text-anchor="middle">schemas + memory-store CLI</text>
  </g>
  <!-- decisions -->
  <g>
    <rect x="352" y="602" width="200" height="104" rx="10" fill="#171923" stroke="#2E3247" stroke-width="1.5"/>
    <text x="452" y="630" fill="#A78BFA" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">DECISIONS</text>
    <text x="452" y="656" fill="#f3f4f6" font-size="24" font-weight="800" text-anchor="middle">5</text>
    <text x="452" y="680" fill="#9aa7bd" font-size="13" text-anchor="middle">gates, policy, risk matrix</text>
  </g>
  <!-- playbooks -->
  <g>
    <rect x="122" y="486" width="200" height="104" rx="10" fill="#171923" stroke="#2E3247" stroke-width="1.5"/>
    <text x="222" y="514" fill="#A78BFA" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">PLAYBOOKS</text>
    <text x="222" y="540" fill="#f3f4f6" font-size="24" font-weight="800" text-anchor="middle">8</text>
    <text x="222" y="564" fill="#9aa7bd" font-size="13" text-anchor="middle">phased, owned operations</text>
  </g>
  <!-- tools -->
  <g>
    <rect x="70" y="308" width="200" height="104" rx="10" fill="#171923" stroke="#2E3247" stroke-width="1.5"/>
    <text x="170" y="336" fill="#A78BFA" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">TOOLS</text>
    <text x="170" y="362" fill="#f3f4f6" font-size="24" font-weight="800" text-anchor="middle">47</text>
    <text x="170" y="386" fill="#9aa7bd" font-size="13" text-anchor="middle">stdlib CLIs with --help</text>
  </g>
  <!-- platforms -->
  <g>
    <rect x="220" y="151" width="200" height="104" rx="10" fill="#171923" stroke="#A3FF12" stroke-width="2"/>
    <text x="320" y="179" fill="#A3FF12" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">PLATFORMS</text>
    <text x="320" y="205" fill="#f3f4f6" font-size="24" font-weight="800" text-anchor="middle">19</text>
    <text x="320" y="229" fill="#9aa7bd" font-size="13" text-anchor="middle">--platform install targets</text>
  </g>

  <text x="600" y="772" fill="#7d8ea8" font-size="14" text-anchor="middle">Workflows (4 reusable multi-agent patterns) orchestrate agents across an operation.</text>
</svg>
